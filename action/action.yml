name: 'agenttruth'
description: 'Fail the build when CLAUDE.md / AGENTS.md / README stop matching the code'
author: 'hemv-857'
inputs:
  dir:
    description: 'Repo root to scan'
    required: false
    default: '.'
  fail-on:
    description: 'error | any | none'
    required: false
    default: 'any'
runs:
  using: 'node20'
  main: '../bin/agenttruth.js'
branding:
  icon: 'alert-triangle'
  color: 'red'
